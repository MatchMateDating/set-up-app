<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finish in App - matchmate</title>
  <link rel="icon" type="image/png" href="images/MatchMate_logo_thicker.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .done-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--off-white);
    }

    .done-card {
      width: 100%;
      max-width: 560px;
      background: var(--white);
      border: 1px solid var(--border-gray);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .done-logo {
      width: 70px;
      height: auto;
      max-height: 70px;
      display: block;
      margin: 0 auto 14px;
      object-fit: contain;
    }

    .done-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .done-subtitle {
      color: var(--text-medium);
      margin-bottom: 16px;
    }

    .done-steps {
      text-align: left;
      margin: 0 auto;
      max-width: 420px;
      color: var(--text-light);
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main class="done-shell">
    <section class="done-card">
      <img src="images/MatchMate_logo_thicker.png" alt="matchmate logo" class="done-logo">
      <h1 id="doneTitle" class="done-title">Account Created</h1>
      <p id="doneSubtitle" class="done-subtitle">You're all set. Finish setup in the MatchMate app.</p>
      <div class="done-steps">
        <p id="doneStep1">1. Open the MatchMate app on your phone.</p>
        <p id="doneStep2">2. Log in with the email and password you just created.</p>
        <p id="doneStep3">3. Complete the rest of your profile in-app.</p>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var flow = (params.get("flow") || "").trim().toLowerCase();
      var inviterType = (params.get("inviter_type") || "").trim().toLowerCase();

      var doneTitle = document.getElementById("doneTitle");
      var doneSubtitle = document.getElementById("doneSubtitle");
      var doneStep2 = document.getElementById("doneStep2");
      var doneStep3 = document.getElementById("doneStep3");

      if (inviterType === "matchmaker") {
        var mmName = (params.get("referrer_first_name") || "").trim();
        var mmText = mmName || "your matchmaker";
        if (flow === "existing") {
          if (doneTitle) doneTitle.textContent = "Linked to " + mmText;
          if (doneSubtitle) doneSubtitle.textContent = "You're all set.";
          if (doneStep2) doneStep2.textContent = "2. Log in with the email you just used.";
          if (doneStep3) doneStep3.textContent = "3. Complete your profile in the app.";
        } else {
          if (doneSubtitle) doneSubtitle.textContent = mmName
            ? "You're connected to " + mmName + ". Finish setup in the MatchMate app."
            : "Finish setup in the MatchMate app.";
          if (doneStep3) doneStep3.textContent = "3. Complete your profile so your matchmaker can help you find matches.";
        }
        return;
      }

      if (flow !== "existing") return;

      var referrerFirstName = (params.get("referrer_first_name") || "").trim();
      var referrerNameText = referrerFirstName || "your dater";

      if (doneTitle) doneTitle.textContent = "Referral Code added";
      if (doneSubtitle) doneSubtitle.textContent = "You're all set.";
      if (doneStep2) doneStep2.textContent = "2. Login with the email that you just used.";
      if (doneStep3) doneStep3.textContent = "3. Start Matchmaking for " + referrerNameText;
    })();
  </script>
</body>
</html>
